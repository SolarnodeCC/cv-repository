name: Deploy CV editor

on:
  push:
    branches: [main]
    paths:
      - "editor/**"
      - "web/**"
      - "shared/**"
      - "solarnode/**"
      - "requirements.txt"
      - ".github/workflows/deploy-editor.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-cv-editor-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy solarnode-cv-editor Container
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: editor
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: editor/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Deploy Worker + Container image
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: editor
          command: deploy

      - name: Post-deploy ops (GitHub token + Access + smoke)
        working-directory: editor
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CV_EDITOR_GITHUB_TOKEN: ${{ secrets.CV_EDITOR_GITHUB_TOKEN }}
          ACCESS_ALLOWED_EMAILS: ${{ secrets.ACCESS_ALLOWED_EMAILS }}
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
          EDITOR_WORKER_NAME: solarnode-cv-editor
          EDITOR_WORKERS_DEV_HOST: solarnode-cv-editor.oostelaar.workers.dev
        run: node ./scripts/post-deploy-ops.mjs
