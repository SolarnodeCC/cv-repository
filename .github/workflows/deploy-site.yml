name: Deploy CV site

on:
  push:
    branches: [main]
    paths:
      - "cv.yaml"
      - "solarnode/**"
      - "requirements.txt"
      - "site/**"
      - "shared/**"
      - ".github/workflows/deploy-site.yml"
  workflow_dispatch:
    inputs:
      force_r2_seed:
        description: "Overwrite existing R2 keys (promote from Git)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: deploy-cv-site-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy solarnode-cv Worker
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install RenderCV (pinned)
        run: python -m pip install -r requirements.txt

      - name: Render CV artifacts
        run: make render

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Install site dependencies
        working-directory: site
        run: npm ci

      - name: Sync RenderCV output into site/public
        working-directory: site
        run: npm run sync

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: site
          command: deploy

      - name: Seed R2 with CV artifacts
        working-directory: site
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          R2_SEED_FORCE: ${{ github.event_name == 'workflow_dispatch' && inputs.force_r2_seed && '1' || '0' }}
        run: npm run seed-r2
