name: Render CV

on:
  push:
    branches: [main]
    paths:
      - "cv.yaml"
      - "solarnode/**"
      - "requirements.txt"
      - "shared/**"
      - ".github/workflows/render.yml"
  workflow_dispatch:
    inputs:
      force_r2_seed:
        description: "Overwrite existing R2 keys (promote from Git)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: render-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  render:
    name: Build PDF and upload artifacts
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install RenderCV (pinned)
        run: python -m pip install -r requirements.txt

      - name: Render CV
        id: render
        run: |
          set +e
          make render > render_output.txt 2>&1
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"

      - name: Write failure summary
        if: steps.render.outputs.exit_code != '0'
        run: |
          {
            echo "## Render failed"
            echo ""
            echo '```text'
            cat render_output.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "${{ steps.render.outputs.exit_code }}"

      - name: Upload CV artifacts
        if: steps.render.outputs.exit_code == '0'
        uses: actions/upload-artifact@v4
        with:
          name: cv-output
          path: |
            output/CV.pdf
            output/CV.html
            output/CV.md
            output/CV.typ
            output/CV_*.png
          if-no-files-found: error

      - name: Seed R2 for public site
        if: steps.render.outputs.exit_code == '0'
        continue-on-error: true
        working-directory: site
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          R2_SEED_FORCE: ${{ github.event_name == 'workflow_dispatch' && inputs.force_r2_seed && '1' || '0' }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "Skipping R2 seed (Cloudflare secrets not configured)"
            exit 0
          fi
          npm ci
          npm run seed-r2

      - name: Write success summary
        if: steps.render.outputs.exit_code == '0'
        run: |
          {
            echo "## CV rendered"
            echo ""
            echo "Download the **cv-output** artifact from this run (PDF, HTML, PNG, Typst)."
            echo ""
            if [ "${{ github.event.inputs.force_r2_seed }}" = "true" ]; then
              echo "R2 seed ran with **force** (promote from Git)."
            else
              echo "R2 bucket \`solarnode-cv-data\` bootstrap-seed (existing keys skipped)."
            fi
            echo ""
            echo "Local equivalent: \`make render\` → \`output/CV.pdf\`"
          } >> "$GITHUB_STEP_SUMMARY"
          exit "${{ steps.render.outputs.exit_code }}"
