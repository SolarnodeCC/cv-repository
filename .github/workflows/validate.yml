name: Validate CV

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate cv.yaml
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install RenderCV (pinned) + test deps
        run: |
          python -m pip install -r requirements.txt
          python -m pip install -r requirements-dev.txt

      - name: Unit + integration tests
        run: python -m pytest web/ -q

      - name: Dry-run render
        id: dry_run
        run: |
          set +e
          rendercv render cv.yaml \
            --dont-generate-html \
            --dont-generate-markdown \
            --dont-generate-png \
            --output-folder /tmp/rendercv-validate \
            > lint_output.txt 2>&1
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"

      - name: Application-readiness checklist
        run: |
          python - <<'PY'
          from pathlib import Path
          from web.checklist import evaluate_application_readiness
          result = evaluate_application_readiness(Path("cv.yaml").read_text(encoding="utf-8"))
          print(result["summary"])
          for c in result["checks"]:
              flag = "OK" if c["ok"] else c["severity"].upper()
              print(f"  [{flag}] {c['label']}: {c['detail']}")
          if result["errors"]:
              raise SystemExit(f"Checklist blocking errors: {result['errors']}")
          if result["score"] < 80:
              raise SystemExit(f"Checklist score too low: {result['score']}")
          PY

      - name: Write failure summary
        if: steps.dry_run.outputs.exit_code != '0'
        run: |
          {
            echo "## Validation failed"
            echo ""
            echo "RenderCV rejected \`cv.yaml\` (or the \`solarnode\` theme). Fix before merging."
            echo ""
            echo "### Error output"
            echo '```text'
            cat lint_output.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Write success summary
        if: steps.dry_run.outputs.exit_code == '0'
        run: |
          {
            echo "## Validation passed"
            echo ""
            echo "\`cv.yaml\` + theme \`solarnode\` render successfully."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Exit with render status
        run: exit "${{ steps.dry_run.outputs.exit_code }}"
