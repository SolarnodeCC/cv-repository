# yaml-language-server: $schema=https://raw.githubusercontent.com/rendercv/rendercv/refs/tags/v2.8/schema.json
#
# Solarnode CV — bronbestand voor RenderCV.
# Sollicitatie-tips (ATS / NL-EU standaard, cf. Resume.io · FlowCV · Rezi):
# - Eén kolom, omgekeerd chronologisch, standaardsecties
# - Telefoon + e-mail + LinkedIn in de header (niet alleen footer)
# - 2–3 zinnen profiel zonder tool-marketing
# - 3–5 highlights per recente rol mét cijfers
# - Vaardigheden als keywords die in de vacature staan
# Daarna: make render  óf  Check/Render in de web editor
#
cv:
  name: Jouw Naam
  headline: Software Engineer
  location: Amsterdam, Nederland
  email: info@solarnode.cc
  photo:
  phone: +31 6 12345678
  website: https://solarnode.cc
  social_networks:
    - network: GitHub
      username: SolarnodeCC
    - network: LinkedIn
      username: solarnode
  custom_connections:
  sections:
    Profiel:
      - Software engineer met focus op betrouwbare backends, CI/CD en developer tooling.
        Levert reproduceerbare pipelines en duidelijke documentatie zodat teams sneller
        kunnen shippen zonder in te leveren op kwaliteit.
    Werkervaring:
      - company: Solarnode
        position: Software Engineer
        date:
        start_date: 2024-01
        end_date: present
        location: Remote / NL
        summary: Bouwen en onderhouden van softwareproducten en interne developer tooling.
        highlights:
          - "YAML→PDF CV-pipeline opgezet (RenderCV + Typst); buildtijd < 2s, 100% reproduceerbaar via CI"
          - "GitHub Actions validatie + artifact-publicatie geautomatiseerd; 0 handmatige release-stappen"
          - "Documentatie en lokale make-workflows geschreven; onboarding nieuwe contributors ~30% sneller"
      - company: Voorbeeld Bedrijf
        position: Junior Developer
        date:
        start_date: 2022-09
        end_date: 2023-12
        location: Nederland
        summary:
        highlights:
          - "Features geleverd in productie-codebase; ~8 PRs/sprint met code review"
          - "Unit- en integratietests uitgebreid; coverage van kritieke modules +15%"
          - "Samenwerking met product en design in 2-weekse sprints"
    Opleiding:
      - institution: Voorbeeld Hogeschool / Universiteit
        area: Informatica
        degree: BSc
        date:
        start_date: 2018-09
        end_date: 2022-06
        location: Nederland
        summary:
        highlights:
          - "Afstudeerproject: beschrijf hier kort het resultaat en de gemeten impact"
          - "Relevante vakken: algoritmen, databases, netwerken, software engineering"
    Projecten:
      - name: cv-repository
        location: GitHub
        date: 2026
        start_date:
        end_date:
        summary: Open YAML-CV met custom theme, lokale build en CI.
        highlights:
          - "Custom Typst-theme solarnode naast cv.yaml"
          - "make render voor PDF/PNG/HTML; web editor met sollicitatie-check"
          - "GitHub Actions valideert YAML en publiceert artifacts"
      - name: Ander project
        location:
        date:
        start_date: 2023-01
        end_date: 2023-06
        summary: Korte beschrijving van een side project of open-source bijdrage.
        highlights:
          - "Tech stack en impact hier (gebruikers, latency, kosten, …)"
    Vaardigheden:
      - label: Talen
        details: Python, TypeScript, SQL
      - label: Tools
        details: Git, GitHub Actions, Docker, RenderCV, Typst
      - label: Praktijk
        details: CI/CD, code review, technische documentatie, observability
    Talen:
      - label: Nederlands
        details: Moedertaal (C2)
      - label: Engels
        details: Professioneel (C1)
    Certificeringen:
      - name: Voorbeeld certificaat (AWS / Azure / Scrumban)
        date: 2025

design:
  theme: solarnode
  page:
    size: a4
    top_margin: 1.4cm
    bottom_margin: 1.4cm
    left_margin: 1.4cm
    right_margin: 1.4cm
    show_footer: true
    show_top_note: true
  colors:
    body: rgb(20, 20, 20)
    name: rgb(15, 48, 80)
    headline: rgb(15, 48, 80)
    connections: rgb(15, 48, 80)
    section_titles: rgb(15, 48, 80)
    links: rgb(180, 110, 25)
    footer: rgb(120, 120, 120)
    top_note: rgb(120, 120, 120)
  typography:
    line_spacing: 0.55em
    alignment: justified-with-no-hyphenation
    font_family:
      body: Source Sans 3
      name: Source Sans 3
      headline: Source Sans 3
      connections: Source Sans 3
      section_titles: Source Sans 3
    font_size:
      body: 10pt
      name: 24pt
      headline: 11pt
      connections: 9.5pt
      section_titles: 1.2em
  links:
    underline: false
    show_external_link_icon: false
  section_titles:
    type: with_partial_line
    space_above: 0.45cm
    space_below: 0.25cm
  entries:
    date_and_location_width: 3.8cm
    side_space: 0.15cm
    space_between_columns: 0.15cm
    allow_page_break: false
    short_second_row: false
    degree_width: 1cm
    summary:
      space_above: 0.05cm
      space_left: 0cm
    highlights:
      bullet: "•"
      nested_bullet: "◦"
      space_left: 0cm
      space_above: 0.05cm

locale:
  language: dutch

settings:
  current_date: today
  render_command:
    output_folder: output
    typst_path: OUTPUT_FOLDER/CV.typ
    pdf_path: OUTPUT_FOLDER/CV.pdf
    markdown_path: OUTPUT_FOLDER/CV.md
    html_path: OUTPUT_FOLDER/CV.html
    png_path: OUTPUT_FOLDER/CV.png
    dont_generate_markdown: false
    dont_generate_html: false
    dont_generate_typst: false
    dont_generate_pdf: false
    dont_generate_png: false
  bold_keywords: []
  pdf_title: CV
